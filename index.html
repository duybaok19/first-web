<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            background-size: 300% 300%;
            animation: bg 12s ease infinite;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            animation: fadeUp 0.8s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 { margin: 0 0 16px; color: #222; }
        p  { margin: 6px 0; color: #555; font-size: 1.05rem; }

        .badge {
            display: inline-block;
            background: #eef0ff;
            color: #5a55d6;
            padding: 6px 16px;
            border-radius: 999px;
            font-weight: 600;
            margin: 4px;
        }

        img {
            width: 100%;
            margin-top: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        img:hover {
            transform: scale(1.03);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        .btn {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 32px;
            border-radius: 999px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(118, 75, 162, 0.5);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes bg {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 600px) {
            .card { padding: 24px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>MY FIRST WEB</h1>
        <h2>Phan Lê Duy Bảo</h2>

        <span class="badge">MSSV: 24520180</span>
        <span class="badge">Trường: UIT</span>

        <img src="uit.jpg" alt="UIT">

        <a class="btn" href="lineup.html">⚽ Tạo đội hình bóng đá</a>
    </div>
</body>
</html>
